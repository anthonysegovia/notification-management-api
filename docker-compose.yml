services:
  postgres:
    image: postgres:17
    container_name: notifications-db

    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: notifications-api

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: notifications-api-super-secret-key-for-jwt-signing-2026
      JWT_EXPIRATION: 3600000

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080

    container_name: notifications-frontend

    ports:
      - "5173:80"

    depends_on:
      - api

volumes:
  postgres_data: